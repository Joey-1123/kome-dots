name: kome CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run lint
        run: bash tests/lint.sh

  verify-config:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hyprland + lua
        run: pacman -Sy --noconfirm hyprland lua
      - name: Verify Hyprland config
        run: bash tests/verify-config.sh

  install-args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer arg precedence + dry-run
        run: bash tests/install-args.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          shellcheck -x install.sh
          shellcheck -x install/main.sh
          shellcheck -x install/lib/*.sh
          shellcheck -x scripts/kome-*
          shellcheck -x tests/*.sh