# kome — lock screen with media controls (inspired by 43PR/dotfiles)
# Colors are generated by matugen.
source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = $background_image
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 260, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    rounding = 12
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $text_color
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    check_color = $entry_color
    fail_color = rgb(ff6b6b)
    fade_on_empty = false
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $text_color
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = $text_color
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# MEDIA CONTROLS (from 43PR) -------------------------------------------------
# Now playing
label {
    monitor =
    text = cmd[update:1] kome-now-playing
    color = $text_color
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -300
    halign = center
    valign = center
}

# Previous
label {
    monitor =
    text = 󰒮
    color = $text_color
    font_size = 28
    font_family = Symbols Nerd Font
    position = -40, -370
    halign = center
    valign = center
    onclick = playerctl --player="$(kome-active-player)" previous
}

# Play/Pause
label {
    monitor =
    text = cmd[update:1] kome-now-playing pause
    color = $text_color
    font_size = 28
    font_family = Symbols Nerd Font
    position = 0, -370
    halign = center
    valign = center
    onclick = playerctl --player="$(kome-active-player)" play-pause
}

# Next
label {
    monitor =
    text = 󰒭
    color = $text_color
    font_size = 28
    font_family = Symbols Nerd Font
    position = 40, -370
    halign = center
    valign = center
    onclick = playerctl --player="$(kome-active-player)" next
}

# PASSWORD CURSOR (from 43PR) -----------------------------------------------
label {
    monitor =
    text = cmd[update:1] kome-password-cursor
    color = $text_color
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 2
    halign = center
    valign = center
}