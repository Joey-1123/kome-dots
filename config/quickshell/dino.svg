<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 44" width="240" height="220" shape-rendering="crispEdges" role="img" aria-label="Chrome dino">
  <title>Chrome dino</title>
  <g fill="#8ab4f8">
    <!-- head + snout -->
    <rect x="28" y="10" width="12" height="2"/>
    <rect x="40" y="12" width="6" height="2"/>
    <rect x="38" y="14" width="8" height="2"/>
    <rect x="28" y="12" width="12" height="2"/>
    <!-- eye -->
    <rect x="34" y="11" width="2" height="2" fill="#000000" opacity="0.9"/>
    <!-- neck -->
    <rect x="26" y="14" width="4" height="6"/>
    <!-- body -->
    <rect x="16" y="14" width="10" height="8"/>
    <rect x="14" y="16" width="2" height="4"/>
    <!-- tail -->
    <rect x="8" y="18" width="6" height="2"/>
    <rect x="4" y="20" width="4" height="2"/>
    <rect x="2" y="22" width="2" height="2"/>
    <!-- belly shading -->
    <rect x="18" y="22" width="8" height="2" opacity="0.45"/>
    <!-- front leg -->
    <rect x="22" y="24" width="2" height="8"/>
    <rect x="20" y="32" width="6" height="2"/>
    <!-- back leg -->
    <rect x="14" y="24" width="2" height="6"/>
    <rect x="12" y="30" width="4" height="2"/>
    <!-- ground -->
    <rect x="0" y="36" width="48" height="2" opacity="0.25"/>
  </g>
</svg>
